# This file replaces the image's default config, which is what binds TorchServe to all
# interfaces. Without these three lines it listens on 127.0.0.1 and the container
# reports healthy while answering nobody outside it.
inference_address=http://0.0.0.0:8080
management_address=http://0.0.0.0:8081
metrics_address=http://0.0.0.0:8082

# One worker per model. TorchServe defaults to one worker per CPU core and each worker
# loads its own copy of the model, which exhausts memory on a laptop.
default_workers_per_model=1
