# Backing services for the object-counter app.
#
#   docker compose up -d          start TensorFlow Serving + MongoDB
#   docker compose ps             check health
#   docker compose logs -f        follow logs
#   docker compose down           stop (MongoDB data is kept in the named volume)
#   docker compose down -v        stop and wipe MongoDB data
#
# The app itself still runs on the host:
#   ENV=prod python -m counter.entrypoints.webapp

services:
  tfserving:
    image: tensorflow/serving:${TFS_VERSION:-latest}
    container_name: tfserving
    ports:
      - "${TFS_PORT:-8501}:8501"   # REST
      - "${TFS_GRPC_PORT:-8500}:8500"   # gRPC
    volumes:
      # Expects tmp/model/<MODEL_NAME>/<version>/saved_model.pb
      - ./tmp/model:/models:ro
    environment:
      MODEL_NAME: ${MODEL_NAME:-ssd_mobilenet_v2}
      OMP_NUM_THREADS: ${NUM_PHYSICAL_CORES:-8}
      TENSORFLOW_INTRA_OP_PARALLELISM: ${NUM_PHYSICAL_CORES:-8}
    healthcheck:
      # The serving image has no curl, so probe the REST port over bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8501' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  mongo:
    image: mongo:${MONGO_VERSION:-latest}
    container_name: test-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo-data:
