# Backing services for the object-counter app.
#
#   docker compose up -d          start TensorFlow Serving + MongoDB
#   docker compose ps             check health
#   docker compose logs -f        follow logs
#   docker compose down           stop (MongoDB data is kept in the named volume)
#   docker compose down -v        stop and wipe MongoDB data
#
# The app itself still runs on the host:
#   ENV=prod python -m counter.entrypoints.webapp

services:
  tfserving:
    image: tensorflow/serving:${TFS_VERSION:-latest}
    container_name: tfserving
    ports:
      - "${TFS_PORT:-8501}:8501"   # REST
      - "${TFS_GRPC_PORT:-8500}:8500"   # gRPC
    volumes:
      # Expects tmp/model/<MODEL_NAME>/<version>/saved_model.pb
      - ./tmp/model:/models:ro
    environment:
      MODEL_NAME: ${MODEL_NAME:-ssd_mobilenet_v2}
      OMP_NUM_THREADS: ${NUM_PHYSICAL_CORES:-8}
      TENSORFLOW_INTRA_OP_PARALLELISM: ${NUM_PHYSICAL_CORES:-8}
    healthcheck:
      # The serving image has no curl, so probe the REST port over bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8501' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  torchserve:
    image: pytorch/torchserve:${TORCHSERVE_VERSION:-0.12.0-cpu}
    container_name: torchserve
    ports:
      - "${TORCHSERVE_PORT:-8080}:8080"   # inference
      - "8081:8081"                       # management
      - "8082:8082"                       # metrics
    volumes:
      # Built by `make setup-pytorch-model`.
      - ./tmp/torch-model-store:/home/model-server/model-store:ro
      # Replaces the image default, which is what binds TorchServe to 0.0.0.0 and
      # caps the worker count. Without it the container answers only itself.
      - ./torchserve/config.properties:/home/model-server/config.properties:ro
    command: >
      torchserve --start --foreground
      --ts-config /home/model-server/config.properties
      --model-store /home/model-server/model-store
      --models ssdlite=ssdlite.mar
      --disable-token-auth
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if b'Healthy' in urllib.request.urlopen('http://localhost:8080/ping', timeout=3).read() else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  mongo:
    image: mongo:${MONGO_VERSION:-latest}
    container_name: test-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:${POSTGRES_VERSION:-16}
    container_name: test-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Applied by the entrypoint on first start.
      - ./sql:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-prod_counter}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo-data:
  postgres-data:
